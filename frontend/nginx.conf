# nginx config for serving the built React app.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page-app fallback.
    #
    # This is the one line that matters. React Router handles /leads/3 in the
    # browser, but on a hard refresh the browser asks nginx for /leads/3 -- a path
    # that does not exist on disk. Without this, that is a 404. Serving index.html
    # instead lets the router take over and render the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames (index-DfWgMR5e.js), so an asset's content
    # can never change without its name changing. That makes them safe to cache
    # forever -- and it is why index.html itself must NOT be cached this way.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html is the entry point that references the fingerprinted assets, so
    # it must always be revalidated. Cache it and users keep loading yesterday's
    # app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
